<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flotte du Service</title>
<style>
:root {
  --bg: #eef1f6;
  --bg2: #ffffff;
  --bg3: #f4f6fa;
  --border: rgba(30,60,120,0.10);
  --border2: rgba(30,60,120,0.18);
  --text: #1a2340;
  --muted: #5a6a8a;
  --accent: #1a56db;
  --accent2: #1040b0;
  --green: #16803c;
  --green-bg: rgba(22,128,60,0.10);
  --green-border: rgba(22,128,60,0.28);
  --orange: #c2590a;
  --orange-bg: rgba(194,89,10,0.10);
  --orange-border: rgba(194,89,10,0.28);
  --red: #c0202a;
  --red-bg: rgba(192,32,42,0.10);
  --red-border: rgba(192,32,42,0.28);
  --blue-bg: rgba(26,86,219,0.10);
  --blue-border: rgba(26,86,219,0.28);
  --radius: 10px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
.nav { display: flex; align-items: center; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg2); padding: 0 1.5rem; }
.nav-logo { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-right: 2rem; padding: 1rem 0; }
.nav-logo span { color: var(--accent); }
.tab { padding: 1rem 1.25rem; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); transition: all .15s; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }
.nav-clock { margin-left: auto; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* ═══════════════════════════ DISPLAY PAGE ═══════════════════════════ */
.display-page { padding: 0.75rem 1.25rem; }
.display-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.6rem; }
.display-header h1 { font-size: 16px; font-weight: 600; }
.display-header .subtitle { font-size: 12px; color: var(--muted); }
.refresh-badge { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

/* Status grid */
.vehicles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-bottom: 0.7rem; }
.vehicle-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.6rem 0.9rem; transition: border-color .2s; }
.vehicle-card.status-dispo { border-left: 3px solid var(--green); }
.vehicle-card.status-reserve { border-left: 3px solid var(--accent); }
.vehicle-card.status-service { border-left: 3px solid var(--orange); }
.vehicle-card.status-panne { border-left: 3px solid var(--red); }
.vc-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.vc-icon { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.status-dispo .vc-icon { background: var(--green-bg); }
.status-reserve .vc-icon { background: var(--blue-bg); }
.status-service .vc-icon { background: var(--orange-bg); }
.status-panne .vc-icon { background: var(--red-bg); }
.vc-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.vc-type { font-size: 11px; color: var(--muted); margin-top: 1px; }
.vc-status-badge { margin-left: auto; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 20px; text-transform: uppercase; letter-spacing: .05em; }
.status-dispo .vc-status-badge { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.status-reserve .vc-status-badge { background: var(--blue-bg); color: var(--accent); border: 1px solid var(--blue-border); }
.status-service .vc-status-badge { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
.status-panne .vc-status-badge { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.vc-info { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.vc-info-row { display: flex; align-items: center; gap: 6px; }
.vc-info-row svg { flex-shrink: 0; opacity: .6; }
.vc-info strong { color: var(--text); }

/* Stats bar */
.stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 0.7rem; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem .9rem; }
.stat-val { font-size: 24px; font-weight: 700; line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat-card.s-dispo .stat-val { color: var(--green); }
.stat-card.s-busy .stat-val { color: var(--red); }
.stat-card.s-res .stat-val { color: var(--accent); }
.stat-card.s-block .stat-val { color: var(--orange); }

/* Week timeline (display) */
.week-section { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
.week-section h2 { font-size: 15px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 1rem; }
.timeline-grid { display: grid; grid-template-columns: 140px repeat(7,1fr); gap: 1px; background: var(--border); border-radius: 8px; overflow: hidden; }
.tg-cell { background: var(--bg3); padding: 7px 6px; font-size: 11px; }
.tg-head { font-weight: 600; color: var(--muted); text-align: center; font-size: 13px; }
.tg-head.today { color: var(--accent); background: rgba(59,130,246,.08); }
.tg-vname { font-size: 13px; font-weight: 500; color: var(--text); }
.tg-vtype { font-size: 12px; color: var(--muted); }
.tg-slot { text-align: center; position: relative; min-height: 36px; }
.tg-dot { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.tg-entry { font-size: 11px; font-weight: 600; padding: 2px 4px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg-entry.res { background: var(--blue-bg); color: var(--accent); border: 1px solid var(--blue-border); }
.tg-entry.service { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
.tg-entry.panne { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

/* ═══════════════════════════ GESTION PAGE ═══════════════════════════ */
.manage-page { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 49px); }
.panel-left { background: var(--bg2); border-right: 1px solid var(--border); padding: 1.25rem; overflow-y: auto; }
.panel-right { padding: 1.25rem; overflow-y: auto; }
.panel-left h2, .panel-right h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 1rem; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px;
  color: var(--text); font-size: 15px; padding: 8px 10px; outline: none; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group select option { background: var(--bg3); }

.type-pills { display: flex; gap: 6px; }
.type-pill { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: all .15s; }
.type-pill:hover { border-color: var(--border2); color: var(--text); }
.type-pill.active-res { background: var(--blue-bg); border-color: var(--blue-border); color: var(--accent); }
.type-pill.active-service { background: var(--orange-bg); border-color: var(--orange-border); color: var(--orange); }
.type-pill.active-panne { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }

.btn { padding: 9px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-family: inherit; transition: all .15s; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent2); color: #fff; font-weight: 600; }
.btn-primary:hover { background: var(--accent2); }
.btn-sm { padding: 5px 12px; font-size: 13px; }
.btn-danger { border-color: var(--red-border); color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }
.form-actions { display: flex; gap: 8px; margin-top: 1rem; }

/* Calendar (manage) */
.cal-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
.cal-week-label { font-size: 15px; font-weight: 500; flex: 1; text-align: center; }
.cal-grid { display: grid; grid-template-columns: 140px repeat(7,1fr); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.cal-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.cal-cell:nth-child(8n) { border-right: none; }
.cal-head { background: var(--bg3); padding: 9px 4px; text-align: center; font-size: 13px; color: var(--muted); font-weight: 500; }
.cal-head.today { color: var(--accent); background: rgba(59,130,246,.07); }
.cal-vname { background: var(--bg3); padding: 9px 10px; font-size: 13px; font-weight: 500; }
.cal-vtype { font-size: 12px; color: var(--muted); }
.cal-slot { min-height: 44px; cursor: pointer; padding: 2px; position: relative; transition: background .1s; }
.cal-slot:hover { background: rgba(255,255,255,.04); }
.cal-slot.no-last { border-bottom: none; }
.cal-entry { font-size: 11px; font-weight: 600; padding: 3px 5px; border-radius: 5px; height: 100%; min-height: 38px; display: flex; align-items: center; gap: 3px; overflow: hidden; }
.cal-entry.res { background: var(--blue-bg); color: var(--accent); border: 1px solid var(--blue-border); }
.cal-entry.service { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
.cal-entry.panne { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.cal-entry .entry-del { margin-left: auto; opacity: 0; cursor: pointer; font-size: 11px; line-height: 1; padding: 1px 3px; border-radius: 3px; background: none; border: none; color: inherit; flex-shrink: 0; }
.cal-entry:hover .entry-del { opacity: 1; }
.cal-entry .entry-del:hover { background: rgba(255,255,255,.2); }

/* Entries list */
.entries-list { display: flex; flex-direction: column; gap: 6px; }
.entry-row { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.entry-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.entry-row.res .entry-dot { background: var(--accent); }
.entry-row.service .entry-dot { background: var(--orange); }
.entry-row.panne .entry-dot { background: var(--red); }
.entry-info { flex: 1; min-width: 0; }
.entry-title { font-size: 14px; font-weight: 500; }
.entry-sub { font-size: 13px; color: var(--muted); }
.empty-state { text-align: center; color: var(--muted); font-size: 15px; padding: 2rem; }

/* Toast */
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px; padding: .75rem 1.25rem; font-size: 15px; box-shadow: 0 8px 32px rgba(0,0,0,.4); transform: translateY(10px); opacity: 0; transition: all .25s; pointer-events: none; z-index: 999; }
.toast.show { transform: translateY(0); opacity: 1; }

@media (max-width: 800px) {
  .manage-page { grid-template-columns: 1fr; }
  .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
  .stats-bar { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">🚗 Flotte <span>Service</span></div>
  <button class="tab active" onclick="showPage('display',this)">📺 Affichage</button>
  <button class="tab" onclick="showPage('manage',this)">⚙️ Gestion</button>
  <div class="nav-clock" id="clock"></div>
</nav>

<!-- ═══════ DISPLAY PAGE ═══════ -->
<div id="page-display" class="page active">
  <div class="display-page">
    <div class="display-header">
      <div>
        <h1>État du parc véhicules</h1>
        <div class="subtitle" id="display-date"></div>
      </div>
      <div class="refresh-badge">
        <div class="pulse"></div>
        <span>Mise à jour automatique</span>
      </div>
    </div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="vehicles-grid" id="vehicles-grid"></div>
    <div class="week-section">
      <h2>Planning de la semaine</h2>
      <div class="timeline-grid" id="timeline-grid"></div>
    </div>
  </div>
</div>

<!-- ═══════ MANAGE PAGE ═══════ -->
<div id="page-manage" class="page">
  <div class="manage-page">

    <!-- LEFT: form -->
    <div class="panel-left">
      <h2>Nouvelle entrée</h2>

      <div class="form-group">
        <label>Véhicule</label>
        <select id="f-vehicle"></select>
      </div>

      <div class="form-group">
        <label>Type</label>
        <div class="type-pills">
          <div class="type-pill active-res" data-type="res" onclick="selectType('res')">📅 Réservation</div>
          <div class="type-pill" data-type="service" onclick="selectType('service')">🔧 Service</div>
          <div class="type-pill" data-type="panne" onclick="selectType('panne')">🚨 Panne</div>
        </div>
      </div>

      <div class="form-group">
        <label>Date début</label>
        <input type="date" id="f-start">
      </div>
      <div class="form-group">
        <label>Date fin</label>
        <input type="date" id="f-end">
      </div>
      <div class="form-group">
        <label id="f-person-label">Personne / Service</label>
        <input type="text" id="f-person" placeholder="ex: M. Dupont, DRH…">
      </div>
      <div class="form-group">
        <label>Note (optionnel)</label>
        <textarea id="f-note" placeholder="Informations complémentaires…"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" style="flex:1" onclick="saveEntry()">✓ Enregistrer</button>
        <button class="btn" onclick="resetForm()">↺ Vider</button>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:1.5rem 0">
      <h2>Entrées enregistrées</h2>
      <div class="entries-list" id="entries-list"></div>
    </div>

    <!-- RIGHT: calendar -->
    <div class="panel-right">
      <div class="cal-toolbar">
        <button class="btn btn-sm" onclick="calNav(-1)">◀ Semaine préc.</button>
        <span class="cal-week-label" id="cal-week-label"></span>
        <button class="btn btn-sm" onclick="calNav(1)">Semaine suiv. ▶</button>
        <button class="btn btn-sm" onclick="calNav(0,'today')">Aujourd'hui</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ═══════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAg69mIyePb2kLKEII2zLjVRqH0pj258G8",
  authDomain: "flotte-service-la.firebaseapp.com",
  projectId: "flotte-service-la",
  storageBucket: "flotte-service-la.firebasestorage.app",
  messagingSenderId: "311525318085",
  appId: "1:311525318085:web:0b8d398656a795ca76ffac"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const entriesCol = collection(db, 'entries');

// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const VEHICLES = [
  {id:0, name:'Camion tour 56',   type:'Camion élévateur',  icon:'🚛'},
  {id:1, name:'Camion tour 91',   type:'Camion élévateur',  icon:'🚛'},
  {id:2, name:'Camion tour 1047', type:'Camion élévateur',  icon:'🚛'},
  {id:3, name:'Nacelle 1086',     type:'Nacelle élévatrice',icon:'🚛'},
  {id:4, name:'Camionnette 1067', type:'Camionnette',       icon:'🚐'},
  {id:5, name:'Camion Grue 3013', type:'Grue mobile',       icon:'🚛'},
  {id:6, name:'Mercedes 1043',    type:'Véhicule léger',    icon:'🚗'},
];

const DAYS_FR = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS_SHORT = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];

let entries = [];
let selectedType = 'res';
let calWeekOffset = 0;

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function isoToday(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(iso,n){
  const [y,m,day]=iso.split('-').map(Number);
  const d=new Date(y,m-1,day); d.setDate(d.getDate()+n); return isoDate(d);
}
function parseISO(s){
  const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);
}
function getMondayOf(offset=0){
  const d=new Date(); const dow=d.getDay()||7;
  d.setDate(d.getDate()-dow+1+offset*7); d.setHours(0,0,0,0); return d;
}
function getWeekDays(offset=0){
  const mon=getMondayOf(offset);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(d.getDate()+i); return d; });
}
function statusLabel(t){ return t==='res'?'Réservé':t==='service'?'En service':'En panne'; }

// ═══════════════════════════════════════════
// FIRESTORE — écoute temps réel
// ═══════════════════════════════════════════
onSnapshot(query(entriesCol, orderBy('start')), snapshot => {
  entries = snapshot.docs.map(d => ({...d.data(), _docId: d.id}));
  renderDisplay();
  if(document.getElementById('page-manage').classList.contains('active')){
    renderCalendar();
    renderEntriesList();
  }
});

async function saveEntry(){
  const vId=parseInt(document.getElementById('f-vehicle').value);
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  const person=document.getElementById('f-person').value.trim()||'—';
  const note=document.getElementById('f-note').value.trim();
  if(!start||!end||start>end){ showToast('⚠️ Dates invalides'); return; }
  try {
    await addDoc(entriesCol, {vehicleId:vId, type:selectedType, start, end, person, note});
    resetForm();
    showToast('✓ Entrée enregistrée');
  } catch(e){ showToast('❌ Erreur : '+e.message); }
}

async function deleteEntry(docId){
  try {
    await deleteDoc(doc(db,'entries',docId));
    showToast('🗑 Entrée supprimée');
  } catch(e){ showToast('❌ Erreur : '+e.message); }
}

// Expose pour les onclick HTML
window.saveEntry = saveEntry;
window.deleteEntry = deleteEntry;

// ═══════════════════════════════════════════
// HORLOGE
// ═══════════════════════════════════════════
function updateClock(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

// ═══════════════════════════════════════════
// PAGE SWITCH
// ═══════════════════════════════════════════
window.showPage = function(name, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='manage'){ renderCalendar(); renderEntriesList(); }
};

// ═══════════════════════════════════════════
// DISPLAY PAGE
// ═══════════════════════════════════════════
function getVehicleStatus(vid){
  const today=isoToday();
  const match=entries.find(e=>e.vehicleId===vid && e.start<=today && e.end>=today);
  if(!match) return {status:'dispo',entry:null};
  return {status:match.type,entry:match};
}

function renderDisplay(){
  const now=new Date();
  document.getElementById('display-date').textContent =
    now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  let nDispo=0,nBusy=0,nRes=0,nBlock=0;
  VEHICLES.forEach(v=>{
    const {status}=getVehicleStatus(v.id);
    if(status==='dispo') nDispo++; else nBusy++;
    if(status==='res') nRes++;
    if(status==='service'||status==='panne') nBlock++;
  });
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card s-dispo"><div class="stat-val">${nDispo}</div><div class="stat-lbl">Disponibles</div></div>
    <div class="stat-card s-busy"><div class="stat-val">${nBusy}</div><div class="stat-lbl">Indisponibles</div></div>
    <div class="stat-card s-res"><div class="stat-val">${nRes}</div><div class="stat-lbl">Réservés</div></div>
    <div class="stat-card s-block"><div class="stat-val">${nBlock}</div><div class="stat-lbl">Service / Panne</div></div>
  `;

  document.getElementById('vehicles-grid').innerHTML = VEHICLES.map(v=>{
    const {status,entry}=getVehicleStatus(v.id);
    const badge=status==='dispo'?'Disponible':statusLabel(status);
    const infoRows=entry?`
      <div class="vc-info-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> <strong>${entry.person}</strong></div>
      ${entry.note?`<div class="vc-info-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> ${entry.note}</div>`:''}
      <div class="vc-info-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Jusqu'au ${parseISO(entry.end).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
    `:`<div class="vc-info-row" style="color:var(--green)">✓ Libre — prêt à l'emploi</div>`;
    return `<div class="vehicle-card status-${status}">
      <div class="vc-top">
        <div class="vc-icon">${v.icon}</div>
        <div><div class="vc-name">${v.name}</div><div class="vc-type">${v.type}</div></div>
        <span class="vc-status-badge">${badge}</span>
      </div>
      <div class="vc-info">${infoRows}</div>
    </div>`;
  }).join('');

  const days=getWeekDays(0);
  const todayIso=isoToday();
  let html=`<div class="tg-cell tg-head"></div>`;
  days.forEach(d=>{
    const iso=isoDate(d); const dow=d.getDay()===0?6:d.getDay()-1;
    html+=`<div class="tg-cell tg-head${iso===todayIso?' today':''}">${DAYS_FR[dow]}<br><strong>${d.getDate()}</strong></div>`;
  });
  VEHICLES.forEach(v=>{
    html+=`<div class="tg-cell" style="background:var(--bg3)"><div class="tg-vname">${v.name}</div><div class="tg-vtype">${v.type}</div></div>`;
    days.forEach(d=>{
      const iso=isoDate(d);
      const match=entries.find(e=>e.vehicleId===v.id&&e.start<=iso&&e.end>=iso);
      const isFirst=match&&(match.start===iso||(d===days[0]&&parseISO(match.start)<days[0]));
      html+=`<div class="tg-cell tg-slot">`;
      if(match&&isFirst){
        const weekEnd=days[6],visEnd=parseISO(match.end)>weekEnd?weekEnd:parseISO(match.end);
        const colS=days.findIndex(x=>isoDate(x)===isoDate(parseISO(match.start)<days[0]?days[0]:parseISO(match.start)));
        const colE=days.findIndex(x=>isoDate(x)===isoDate(visEnd));
        const span=colE-colS+1;
        const labels={res:'📅',service:'🔧',panne:'🚨'};
        html+=`<div class="tg-entry ${match.type}" style="position:absolute;left:2px;right:2px;top:2px;bottom:2px;width:calc(${span*100}% + ${span-1}px - 4px);z-index:2;">${labels[match.type]} ${match.person}</div>`;
      } else if(!match){
        html+=`<div style="width:6px;height:6px;border-radius:50%;background:var(--green-bg);border:1px solid var(--green-border);margin:auto;margin-top:13px"></div>`;
      }
      html+=`</div>`;
    });
  });
  document.getElementById('timeline-grid').innerHTML=html;
}

// ═══════════════════════════════════════════
// MANAGE — FORM
// ═══════════════════════════════════════════
const fVehicle=document.getElementById('f-vehicle');
VEHICLES.forEach(v=>{
  const o=document.createElement('option'); o.value=v.id; o.textContent=`${v.icon} ${v.name} (${v.type})`; fVehicle.appendChild(o);
});
document.getElementById('f-start').value=isoToday();
document.getElementById('f-end').value=isoToday();

window.selectType = function(t){
  selectedType=t;
  document.querySelectorAll('.type-pill').forEach(p=>{ p.className='type-pill'+(p.dataset.type===t?' active-'+t:''); });
  document.getElementById('f-person-label').textContent=t==='res'?'Personne / Service':'Motif / Description';
};

function resetForm(){
  document.getElementById('f-person').value='';
  document.getElementById('f-note').value='';
  document.getElementById('f-start').value=isoToday();
  document.getElementById('f-end').value=isoToday();
  window.selectType('res');
}

function renderEntriesList(){
  const list=document.getElementById('entries-list');
  if(!entries.length){ list.innerHTML='<div class="empty-state">Aucune entrée enregistrée</div>'; return; }
  const sorted=[...entries].sort((a,b)=>b.start.localeCompare(a.start));
  list.innerHTML=sorted.map(e=>{
    const v=VEHICLES.find(x=>x.id===e.vehicleId);
    return `<div class="entry-row ${e.type}">
      <div class="entry-dot"></div>
      <div class="entry-info">
        <div class="entry-title">${v.icon} ${v.name} — ${e.person}</div>
        <div class="entry-sub">${e.start} → ${e.end} · ${statusLabel(e.type)}${e.note?' · '+e.note:''}</div>
      </div>
      <button class="btn btn-sm btn-danger" onclick="deleteEntry('${e._docId}')">✕</button>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
// MANAGE — CALENDRIER
// ═══════════════════════════════════════════
window.calNav = function(dir, mode){
  if(mode==='today') calWeekOffset=0; else calWeekOffset+=dir;
  renderCalendar();
};

function renderCalendar(){
  const days=getWeekDays(calWeekOffset);
  const todayIso=isoToday();
  const mon=days[0],sun=days[6];
  document.getElementById('cal-week-label').textContent=
    `${mon.getDate()} ${MONTHS_SHORT[mon.getMonth()]} – ${sun.getDate()} ${MONTHS_SHORT[sun.getMonth()]} ${sun.getFullYear()}`;

  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';

  const corner=document.createElement('div');
  corner.className='cal-cell cal-head'; grid.appendChild(corner);
  days.forEach(d=>{
    const iso=isoDate(d); const dow=d.getDay()===0?6:d.getDay()-1;
    const h=document.createElement('div');
    h.className='cal-cell cal-head'+(iso===todayIso?' today':'');
    h.innerHTML=`${DAYS_FR[dow]}<br><strong style="font-size:15px">${d.getDate()}</strong>`;
    grid.appendChild(h);
  });

  VEHICLES.forEach((v,vi)=>{
    const isLast=vi===VEHICLES.length-1;
    const vc=document.createElement('div');
    vc.className='cal-cell cal-vname'+(isLast?' no-last':'');
    vc.innerHTML=`${v.icon} ${v.name}<div class="cal-vtype">${v.type}</div>`;
    grid.appendChild(vc);

    days.forEach(d=>{
      const iso=isoDate(d);
      const slot=document.createElement('div');
      slot.className='cal-slot'+(isLast?' no-last':'');
      const match=entries.find(e=>e.vehicleId===v.id&&e.start<=iso&&e.end>=iso);
      if(match){
        const isFirst=match.start===iso||(parseISO(match.start)<days[0]&&d===days[0]);
        if(isFirst){
          const weekEnd=days[6];
          const visEnd=parseISO(match.end)>weekEnd?weekEnd:parseISO(match.end);
          const colS=days.findIndex(x=>isoDate(x)===isoDate(parseISO(match.start)<days[0]?days[0]:parseISO(match.start)));
          const colE=days.findIndex(x=>isoDate(x)===isoDate(visEnd));
          const span=colE-colS+1;
          const icons={res:'📅',service:'🔧',panne:'🚨'};
          const en=document.createElement('div');
          en.className='cal-entry '+match.type;
          en.style.cssText=`position:absolute;left:2px;top:2px;bottom:2px;right:2px;width:calc(${span*100}% + ${span-1}px - 4px);z-index:2`;
          en.title=match.note?`${match.person} — ${match.note}`:match.person;
          en.innerHTML=`${icons[match.type]}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${match.person}${match.note?' <span style="opacity:.65;font-weight:400">· '+match.note+'</span>':''}</span><button class="entry-del" onclick="event.stopPropagation();deleteEntry('${match._docId}')" title="Supprimer">✕</button>`;
          slot.appendChild(en);
        }
      } else {
        slot.addEventListener('click',()=>{
          fVehicle.value=v.id;
          document.getElementById('f-start').value=iso;
          document.getElementById('f-end').value=iso;
          document.getElementById('f-person').focus();
        });
      }
      grid.appendChild(slot);
    });
  });
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
